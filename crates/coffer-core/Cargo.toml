[package]
name = "coffer-core"
description = "Coffer vault core: crypto, vault file, items, generator, TOTP, health, import and export"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
argon2 = { version = "0.6", features = ["parallel", "zeroize"] }
base64 = "0.23"
chacha20poly1305 = { version = "0.11", features = ["zeroize"] }
csv = "1"
getrandom = "0.4"
hkdf = "0.13"
hmac = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
sha2 = "0.11"
subtle = "2.6"
thiserror = "2"
time = { version = "0.3.55", features = ["formatting", "parsing", "macros", "serde"] }
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = { version = "1.9", features = ["derive"] }
zip = { version = "9.0.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }
zxcvbn = "3.1"
