[package]
name = "coffer-bridge"
description = "Coffer's native messaging host: passes the browser extension's messages to the running Coffer over a named pipe"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

# The lib (framing, the pipe name, the pipe's ACL) is shared with Coffer
# (src-tauri/src/bridge). The bin is coffer-bridge.exe, which Chrome and Edge
# start through native messaging. It holds no secret and no state.
[lib]
name = "coffer_bridge"
path = "src/lib.rs"

[[bin]]
name = "coffer-bridge"
path = "src/main.rs"

[dependencies]
serde_json = "1"
sha2 = "0.11"
# The features Tauri and the updater already turn on: no new build of tokio.
tokio = { version = "1", features = ["rt", "net", "io-util", "sync", "time"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Pipes",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }
