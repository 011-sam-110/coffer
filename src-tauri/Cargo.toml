[package]
name = "coffer"
description = "Coffer: a local-first password manager in the Windows tray"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
# The `_lib` suffix keeps the lib name apart from the bin name on Windows
# (https://github.com/rust-lang/cargo/issues/8519). Coffer is desktop-only, so
# the lib is a plain rlib: no staticlib or cdylib (they cost link time and disk).
name = "coffer_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-single-instance = "2.5.4"
# Rust-side file and folder dialogs (SPEC 3.7). Same features as Tauri's dialog plugin uses.
rfd = { version = "0.16", default-features = false, features = ["common-controls-v6"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = { version = "1.9.1", features = ["serde"] }
base64 = "0.23.1"
# Same versions as coffer-core uses (no second copy).
sha2 = "0.11"
time = "0.3.55"
# The one network client: the opt-in breach check (SPEC 3.10). rustls + ring + webpki roots.
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
coffer-core = { path = "../crates/coffer-core" }

[target.'cfg(windows)'.dependencies]
# Same versions as Tauri 2.12 / wry 0.57 use, so there is one copy of each.
webview2-com = "0.39"
# IAsyncOperation for the Windows Hello prompt; the version the windows crate uses.
windows-future = "0.3"
windows = { version = "0.62", features = [
  "Foundation",
  "Security_Credentials_UI",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Graphics_Gdi",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Power",
  "Win32_System_RemoteDesktop",
  "Win32_System_SystemInformation",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_System_WinRT",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
