[workspace]
resolver = "3"
members = ["crates/coffer-core", "src-tauri"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
authors = ["011-sam-110"]

# Small, fast release build (https://tauri.app/concept/size/#cargo-configuration)
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Disk on the build machine is tight: no debug info for dependencies, line tables only for ours.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Argon2 is slow without optimisation; keep tests and dev unlocks usable.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
