<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <title>Coffer: unlocked</title>
  <!-- Tray icon, vault unlocked: the same strongbox in the theme primary (#e60039) with
       the lid swung open on its left hinge. Colour and silhouette both change, so the
