    <path transform="rotate(-15 2 7.5)" d="M2 7.5V6.25C2 4.4 4.7 3 8 3s6 1.4 6 3.25V7.5z"/>
    <path d="M2 8.5h12v4c0 .83-.67 1.5-1.5 1.5h-9c-.83 0-1.5-.67-1.5-1.5z"/>
  </g>
  <circle cx="8" cy="10.6" r="1" fill="#1a1a1a"/>
  <rect x="7.5" y="10.6" width="1" height="1.9" fill="#1a1a1a"/>
</svg>
